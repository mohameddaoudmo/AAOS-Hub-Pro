<script>


document.getElementById('tfb').textContent=localStorage.getItem('aaos_theme')==='dark'?'☀️':'🌙';


// Particle canvas


const canvas=document.getElementById('c');


const ctx=canvas.getContext('2d');


let W,H,pts=[];


function resize(){W=canvas.width=window.innerWidth;H=canvas.height=window.innerHeight;}


resize();window.addEventListener('resize',resize);


for(let i=0;i<80;i++)pts.push({x:Math.random()*1e4,y:Math.random()*1e4,vx:(Math.random()-.5)*.3,vy:(Math.random()-.5)*.3,r:Math.random()*1.5+.5,c:Math.random()>.5?'#00d4ff':'#7c3aed'});


function draw(){


  ctx.clearRect(0,0,W,H);


  pts.forEach(p=>{p.x+=p.vx;p.y+=p.vy;if(p.x<0||p.x>W)p.vx*=-1;if(p.y<0||p.y>H)p.vy*=-1;


    ctx.beginPath();ctx.arc(p.x,p.y,p.r,0,Math.PI*2);ctx.fillStyle=p.c+'88';ctx.fill();


  });


  requestAnimationFrame(draw);


}


draw();


</script>


</body>


</html>
